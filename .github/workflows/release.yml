name: release

# Cut a release by pushing a tag:  git tag v1.2.3 && git push origin v1.2.3
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          set -eu
          version="${GITHUB_REF_NAME}"
          [ "${#version}" -le 128 ]
          printf '%s\n' "$version" | LC_ALL=C grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9]+([.-][A-Za-z0-9]+)*)?$'
          bin=mdserve
          [ "$GOOS" = windows ] && bin=mdserve.exe
          go build -trimpath -ldflags "-s -w -X main.version=${version}" -o "$bin" .
          name="mdserve_${version}_${GOOS}_${GOARCH}"
          if [ "$GOOS" = windows ]; then
            zip -q "${name}.zip" "$bin"
            echo "ASSET=${name}.zip" >> "$GITHUB_ENV"
          else
            tar -czf "${name}.tar.gz" "$bin"
            echo "ASSET=${name}.tar.gz" >> "$GITHUB_ENV"
          fi

      - name: Checksum
        run: sha256sum "$ASSET" > "${ASSET}.sha256"

      # Each matrix job only stashes its artifacts; the release is published once,
      # by the single `release` job below. (Calling action-gh-release from every
      # matrix job races on the same release and duplicates the generated notes.)
      - name: Stash artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
          if-no-files-found: error
          retention-days: 1

  release:
    name: publish release
    needs: build
    permissions:
      contents: write   # only publication needs release write access
    runs-on: ubuntu-latest
    steps:
      - name: Collect artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      # Single create → release notes are generated exactly once.
      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true   # auto-build the changelog from commits since the last tag
